{% extends 'movies/base.html' %}

{% block title %}영화 수정 페이지{% endblock %}

{% block content %}
<h1 class="mb-4">영화 수정 페이지</h1>

<form method="POST">
    {% csrf_token %}
    {% for field in form %}
        <div class="mb-3">
            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <div class="alert alert-warning mt-2">
                    {{ field.errors }}
                </div>
            {% endif %}
        </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">수정</button>
</form>
{% endblock %}
