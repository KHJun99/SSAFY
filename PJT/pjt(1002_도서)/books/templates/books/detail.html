{% extends "base.html" %}
{% block content %}
<h2>{{ book.title }}</h2>
<p><b>저자:</b> {{ book.author }}</p>
<p><b>평점:</b> {{ book.rating }}</p>
<p><b>설명:</b><br>{{ book.description|linebreaks }}</p>

<div class="mt-3">
  <a class="btn btn-primary" href="{% url 'books:update' book.pk %}">수정</a>
  <a class="btn btn-secondary" href="{% url 'books:index' %}">목록</a>
  <form class="d-inline" method="post" action="{% url 'books:delete' book.pk %}">{% csrf_token %}
    <button class="btn btn-danger" type="submit">삭제</button>
  </form>
</div>
{% endblock %}
