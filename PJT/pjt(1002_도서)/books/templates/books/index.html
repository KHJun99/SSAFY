{% extends "base.html" %}
{% block content %}
<h2>도서 목록</h2>
<ul class="list-group">
  {% for b in books %}
    <li class="list-group-item d-flex justify-content-between">
      <span><strong>{{ b.title }}</strong> — {{ b.author }}</span>
      <a class="btn btn-sm btn-outline-primary" href="{% url 'books:detail' b.pk %}">상세</a>
    </li>
  {% empty %}
    <li class="list-group-item">등록된 도서가 없습니다.</li>
  {% endfor %}
</ul>
{% endblock %}
