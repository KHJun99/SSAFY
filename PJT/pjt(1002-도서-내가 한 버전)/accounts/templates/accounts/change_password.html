{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
  <h1 class="h4 mb-3">비밀번호 변경</h1>

  {% if messages %}
    {% for m in messages %}
      <div class="alert alert-{{ m.tags }}">{{ m }}</div>
    {% endfor %}
  {% endif %}

  <form method="POST" class="card p-3 shadow-sm">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="d-flex gap-2 mt-2">
      <button type="submit" class="btn btn-primary">변경</button>
      <a href="{% url 'accounts:update' %}" class="btn btn-outline-secondary">내 정보로</a>
      <a href="{% url 'books:index' %}" class="btn btn-light">메인</a>
    </div>
  </form>
</div>
{% endblock content %}
