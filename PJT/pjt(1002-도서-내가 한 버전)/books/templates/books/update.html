{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <h1 class="h4 mb-3">도서 수정</h1>
  
  <form method="POST" action="{% url 'books:update' book.pk %}" class="card p-3 shadow-sm">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit">저장</button>
      <a class="btn btn-outline-secondary" href="{% url 'books:detail' book.pk %}">취소</a>
    </div>
  </form>
</div>
{% endblock content %}
